<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yazan Jaber | Software Engineer</title>
    
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/typography.css">
    <link rel="stylesheet" href="./styles/layout.css">
    <link rel="stylesheet" href="./styles/components.css">
    <link rel="stylesheet" href="./styles/environment.css">
    
    <style>
        .hero-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        
                .animated-logo { font-family: var(--font-display); font-size: 2rem; font-weight: 800; color: #c0c0c0; text-transform: uppercase; letter-spacing: -0.02em; transition: color 0.2s ease; }
        .animated-logo:hover { color: #ccc; }

        .premium-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: var(--space-4) var(--space-8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 7, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border-light);
            z-index: 100;
        }

        .nav-links {
            display: flex;
            gap: var(--space-6);
        }
    </style>
</head>
<body class="theme-red">
    <canvas id="neural-canvas" style="position:fixed; inset:0; z-index:0; pointer-events:none;"></canvas>

    <nav class="premium-nav">
        <a href="index.html" class="animated-logo">YAZAN JABER</a>
        
        <div class="nav-links font-mono text-sm" style="align-items: center;">
            <a href="about.html"><img src="https://github.com/tntcool48-dot.png" alt="Profile" style="width: 32px; height: 32px; border-radius: 50%; opacity: 0.8; transition: opacity 0.3s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.8"></a>
            <a href="projects.html">Projects</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <main class="grid-container">
        <section class="hero-section" style="grid-column: 1/-1;">
            
            <h1 class="display-1 text-gradient">Software Engineer</h1>
            
            <p style="font-size: var(--text-lg); max-width: 600px; margin-top: var(--space-4); color: var(--clr-text-secondary);">
                Undergraduate at Yarmouk University. Specializing in C# and Python to build high-performance tools, desktop applications, and backend infrastructure.
            </p>

            <div style="margin-top: var(--space-8); display: flex; gap: var(--space-4);">
                <a href="projects.html" class="btn btn-primary">View Portfolio</a>
                
                <a href="https://github.com/tntcool48-dot" target="_blank" class="btn btn-glass">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" style="margin-right:8px; vertical-align:middle;">
                        <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                    </svg>
                    GitHub Profile
                </a>
            </div>
        </section>
    </main>

    <script type="module">
        import { PhysicsEngine } from './js/PhysicsEngine.js';
        const physics = new PhysicsEngine('#neural-canvas');
        physics.start();
    </script>
</body>
</html>

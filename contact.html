<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Yazan Jaber</title>
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/typography.css">
    <link rel="stylesheet" href="./styles/layout.css">
    <link rel="stylesheet" href="./styles/components.css">
    <link rel="stylesheet" href="./styles/environment.css">
    <style>
                .animated-logo { font-family: var(--font-display); font-size: 2rem; font-weight: 800; color: #c0c0c0; text-transform: uppercase; letter-spacing: -0.02em; transition: color 0.2s ease; }
        .animated-logo:hover { color: #ccc; } 
        .premium-nav { position: fixed; top: 0; left: 0; right: 0; padding: var(--space-4) var(--space-8); display: flex; justify-content: space-between; align-items: center; background: rgba(5, 5, 7, 0.4); backdrop-filter: blur(12px); border-bottom: 1px solid var(--glass-border-light); z-index: 100; }
        .nav-links { display: flex; gap: var(--space-6); }
        
        .contact-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-6);
            padding: var(--space-12) var(--space-6);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-xl);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: fadeUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .contact-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 400px;
            padding: 1rem 2rem;
            border-radius: var(--radius-md);
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #c0c0c0;
            font-size: var(--text-lg);
            transition: all 0.3s ease;
        }
        
        .contact-btn:hover {
            transform: translateY(-2px);
            background: var(--theme-accent-dim);
            border-color: var(--theme-accent-glow);
            box-shadow: 0 10px 20px var(--theme-accent-dim);
        }
        
        .contact-btn svg {
            margin-right: 12px;
            width: 24px;
            height: 24px;
        }
    </style>
</head>
<body class="theme-red">
    <canvas id="neural-canvas" style="position:fixed; inset:0; z-index:0; pointer-events:none;"></canvas>

    <nav class="premium-nav">
        <a href="index.html" class="animated-logo">YAZAN JABER</a>
        <div class="nav-links font-mono text-sm" style="align-items: center;">
            <a href="about.html"><img src="https://github.com/tntcool48-dot.png" alt="Profile" style="width: 32px; height: 32px; border-radius: 50%; opacity: 0.8; transition: opacity 0.3s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.8"></a>
            <a href="projects.html">Projects</a>
            <a href="about.html">About</a>
            <a href="contact.html" style="color:#c0c0c0; font-weight:bold;">Contact</a>
        </div>
    </nav>

    <main class="grid-container" style="padding-top: 160px; display: flex; justify-content: center;">
        
        <section class="contact-container glass-panel" style="width: 100%; max-width: 800px; grid-column: 1/-1;">
            <h1 class="display-2 text-gradient" style="margin-bottom: var(--space-4);">Let's Connect</h1>
            <p class="text-secondary text-lg" style="text-align: center; max-width: 500px; margin-bottom: var(--space-8);">
                I am currently open for opportunities and collaboration. Feel free to reach out to me directly.
            </p>

            <a href="https://github.com/tntcool48-dot" target="_blank" class="contact-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                </svg>
                GitHub Profile
            </a>

            <a href="mailto:admin@example.com" class="contact-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                Send an Email
            </a>

            <a href="https://www.linkedin.com/in/yazan-jaber-752905378/" target="_blank" class="contact-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                    <rect x="2" y="9" width="4" height="12"></rect>
                    <circle cx="4" cy="4" r="2"></circle>
                </svg>
                LinkedIn Profile
            </a>

        </section>

    </main>

    <script type="module">
        import { PhysicsEngine } from './js/PhysicsEngine.js';
        const physics = new PhysicsEngine('#neural-canvas');
        physics.start();
    </script>
</body>
</html>
